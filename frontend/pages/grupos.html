<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupos — Dpto. Informática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <span class="logo-icon">◈</span>
        <div>
          <div class="logo-title">Dpto. Informática</div>
          <div class="logo-sub">Curso 2025–2026</div>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Gestión</div>
      <a href="../index.html"     class="nav-item"><span class="nav-icon">⊞</span> Dashboard</a>
      <a href="profesores.html"   class="nav-item"><span class="nav-icon">◎</span> Profesores</a>
      <a href="grupos.html"       class="nav-item active"><span class="nav-icon">◧</span> Grupos</a>
      <a href="modulos.html"      class="nav-item"><span class="nav-icon">◫</span> Módulos</a>
      <a href="asignaciones.html" class="nav-item"><span class="nav-icon">◈</span> Asignaciones</a>
    </nav>
    <div class="sidebar-footer"><div class="sidebar-footer-text">TFC — DAM 2025</div></div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title">Grupos</h1>
        <span class="page-sub">Ciclos y grupos del departamento</span>
      </div>
    </header>

    <div class="content-area">
      <div id="alert-box" class="alert"></div>

      <div class="card">
        <div class="card-header">
          <div class="toolbar">
            <input type="text" id="buscador" class="search-input" placeholder="Buscar grupo...">
            <select id="filtro-ciclo" class="search-input" style="width:160px">
              <option value="">Todos los ciclos</option>
              <option value="DAM">DAM</option>
              <option value="DAW">DAW</option>
              <option value="ASIR">ASIR</option>
              <option value="SMR">SMR</option>
              <option value="FPB">FPB</option>
              <option value="ESO">ESO</option>
              <option value="BTO">BTO</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="abrirModalNuevo()">+ Nuevo grupo</button>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Ciclo</th>
                <th>Curso</th>
                <th>Modalidad</th>
                <th>Asignaciones</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tbody-grupos">
              <tr><td colspan="6" class="table-loading">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-titulo">Nuevo grupo</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="grupo-id">
        <div class="form-grid">
          <div class="form-group">
            <label for="grupo-nombre">Nombre del grupo</label>
            <input type="text" id="grupo-nombre" placeholder="Ej: 1º DAM">
          </div>
          <div class="form-group">
            <label for="grupo-ciclo">Ciclo</label>
            <select id="grupo-ciclo">
              <option value="DAM">DAM</option>
              <option value="DAW">DAW</option>
              <option value="ASIR">ASIR</option>
              <option value="SMR">SMR</option>
              <option value="FPB">FPB</option>
              <option value="ESO">ESO</option>
              <option value="BTO">BTO</option>
            </select>
          </div>
          <div class="form-group">
            <label for="grupo-curso">Curso</label>
            <select id="grupo-curso">
              <option value="1">1º</option>
              <option value="2">2º</option>
              <option value="3">3º</option>
              <option value="4">4º</option>
            </select>
          </div>
          <div class="form-group">
            <label for="grupo-modalidad">Modalidad</label>
            <select id="grupo-modalidad">
              <option value="Presencial">Presencial</option>
              <option value="Dual">Dual</option>
              <option value="Semipresencial">Semipresencial</option>
              <option value="Online">Online</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary"   onclick="guardarGrupo()">Guardar</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/grupos.js"></script>
</body>
</html>
