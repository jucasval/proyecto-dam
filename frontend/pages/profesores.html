<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profesores — Dpto. Informática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <span class="logo-icon">◈</span>
        <div>
          <div class="logo-title">Dpto. Informática</div>
          <div class="logo-sub">Curso 2025–2026</div>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Gestión</div>
      <a href="../index.html"        class="nav-item" data-page="dashboard">  <span class="nav-icon">⊞</span> Dashboard</a>
      <a href="profesores.html"      class="nav-item active">                  <span class="nav-icon">◎</span> Profesores</a>
      <a href="grupos.html"          class="nav-item">                         <span class="nav-icon">◧</span> Grupos</a>
      <a href="modulos.html"         class="nav-item">                         <span class="nav-icon">◫</span> Módulos</a>
      <a href="asignaciones.html"    class="nav-item">                         <span class="nav-icon">◈</span> Asignaciones</a>
    </nav>
    <div class="sidebar-footer"><div class="sidebar-footer-text">TFC — DAM 2025</div></div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title">Profesores</h1>
        <span class="page-sub">Gestión del equipo docente</span>
      </div>
    </header>

    <div class="content-area">
      <div id="alert-box" class="alert"></div>

      <div class="card">
        <div class="card-header">
          <div class="toolbar">
            <input type="text" id="buscador" class="search-input" placeholder="Buscar profesor...">
          </div>
          <button class="btn btn-primary" onclick="abrirModalNuevo()">+ Nuevo profesor</button>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Apellidos, Nombre</th>
                <th>Puesto</th>
                <th>Horas contrato</th>
                <th>Horas asignadas</th>
                <th>Horas libres</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tbody-profesores">
              <tr><td colspan="6" class="table-loading">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal crear/editar -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-titulo">Nuevo profesor</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="prof-id">
        <div class="form-grid">
          <div class="form-group">
            <label for="prof-nombre">Nombre</label>
            <input type="text" id="prof-nombre" placeholder="Ej: María Ángeles">
          </div>
          <div class="form-group">
            <label for="prof-apellidos">Apellidos</label>
            <input type="text" id="prof-apellidos" placeholder="Ej: García López">
          </div>
          <div class="form-group">
            <label for="prof-puesto">Puesto</label>
            <select id="prof-puesto">
              <option value="PES">PES — Profesor/a de Enseñanza Secundaria</option>
              <option value="PTFP">PTFP — Profesor/a Técnico de FP</option>
            </select>
          </div>
          <div class="form-group">
            <label for="prof-horas">Horas contrato</label>
            <input type="number" id="prof-horas" value="18" min="1" max="30">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary"   onclick="guardarProfesor()">Guardar</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/profesores.js"></script>
</body>
</html>
